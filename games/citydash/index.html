<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cycle Dash</title>
<!--
  CITY DASH IS NOT SERVED FROM HERE. The game lives in its own repo (cityengine) and on its own site
  (https://dash.dfeldman.org); this page is the whole of it on the platform: it frames the game, passing on the
  session's parameters, and carries the game's /gameapi/* calls — the game cannot make them itself from its own
  origin, since the session cookie does not cross to it. cityengine's src/relay.ts is the other half:

    game ── postMessage {dh:'fetch', id, method, path, body} ──► this page ── fetch /gameapi/… ──► server
    game ◄─ postMessage {dh:'reply', id, status, text} ────────── this page

  It answers only the origins listed in ORIGINS, only for /gameapi/ on this server, only GET/POST/PUT.
  A development copy of the game: ?citydash=http://localhost:5200 on this page's URL (remembered in this browser;
  ?citydash=default forgets it). Only the listed origins can be chosen.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0d1018; overflow: hidden }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block }
  .note { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 520px; padding: 18px 22px;
    border-radius: 14px; background: #1b2033; color: #e8ecf6; font: 500 16px/1.45 system-ui, sans-serif; text-align: center }
  .note code { color: #9fd3ff }
  .dev { position: fixed; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 6px; background: #b8441e; color: #fff;
    font: 600 12px/1.4 system-ui, sans-serif; pointer-events: none; opacity: .85 }
</style>
</head>
<body>
<iframe id="game" allow="fullscreen; gamepad; autoplay" title="Cycle Dash"></iframe>
<script>
(() => {
  // where City Dash is served: the first is the default
  const ORIGINS = ['https://dash.dfeldman.org', 'http://localhost:5200', 'http://127.0.0.1:5200']
  const here = new URLSearchParams(location.search)
  let origin = ORIGINS[0]
  try {
    const asked = here.get('citydash')
    if (asked === 'default') localStorage.removeItem('citydash.origin')
    else if (asked && ORIGINS.includes(asked)) localStorage.setItem('citydash.origin', asked)
    const kept = localStorage.getItem('citydash.origin')
    if (kept && ORIGINS.includes(kept)) origin = kept
  } catch { /* storage blocked: the default */ }

  // the game's URL: the session's own parameters, and who is framing it (src/relay.ts `relayHost`)
  const q = new URLSearchParams()
  for (const k of ['session', 'variant', 'seed', 'debug']) if (here.has(k)) q.set(k, here.get(k))
  q.set('host', location.origin)
  const frame = document.getElementById('game')
  frame.src = `${origin}/index.html?${q}`

  // a development copy says so; and a game that never calls (the dev server not running, the site down) is not left
  // as a silent black page
  if (origin !== ORIGINS[0]) {
    const tag = document.createElement('div')
    tag.className = 'dev'
    tag.textContent = `Cycle Dash from ${origin}`
    document.body.appendChild(tag)
  }
  let heard = false
  setTimeout(() => {
    if (heard) return
    const note = document.createElement('div')
    note.className = 'note'
    note.innerHTML = `Cycle Dash has not started from <code></code>.<br>Is it running?`
      + (origin !== ORIGINS[0] ? ' Add <code>?citydash=default</code> to this page\'s address to use the published game.' : '')
    note.querySelector('code').textContent = origin
    document.body.appendChild(note)
  }, 25000)

  const live = new Map()
  addEventListener('message', async (ev) => {
    if (ev.source !== frame.contentWindow || ev.origin !== origin) return
    heard = true
    document.querySelector('.note')?.remove()
    const m = ev.data
    // the game has not got the keys although this page has the focus (a frame focused while it was still loading
    // keeps the focus on the element, not in the game's document): hand them on (src/relay.ts `keepFocus`)
    if (m && m.dh === 'focus') { if (document.hasFocus()) { focus(); try { frame.contentWindow?.focus() } catch { /* gone */ } } return }
    if (!m || typeof m !== 'object' || typeof m.id !== 'number') return
    if (m.dh === 'abort') { live.get(m.id)?.abort(); live.delete(m.id); return }
    if (m.dh !== 'fetch' || typeof m.path !== 'string') return
    const reply = (r) => frame.contentWindow?.postMessage({ dh: 'reply', id: m.id, ...r }, origin)
    let url
    try { url = new URL(m.path, location.origin) } catch { reply({ error: 'bad path' }); return }
    if (url.origin !== location.origin || !url.pathname.startsWith('/gameapi/')) { reply({ error: 'not a game API path' }); return }
    if (!['GET', 'POST', 'PUT'].includes(m.method)) { reply({ error: 'bad method' }); return }
    const ctl = new AbortController()
    live.set(m.id, ctl)
    try {
      const init = { method: m.method, credentials: 'same-origin', signal: ctl.signal }
      if (typeof m.body === 'string') { init.headers = { 'Content-Type': 'application/json' }; init.body = m.body }
      const res = await fetch(url.pathname + url.search, init)
      reply({ status: res.status, text: await res.text() })
    } catch (e) {
      if (!ctl.signal.aborted) reply({ error: String((e && e.message) || e) })
    } finally {
      live.delete(m.id)
    }
  })

  // The bridge focuses this page when it shows the game: the keys belong to the game, so the focus is handed on to
  // it. Doing that once was not enough (2026-10-17, #302: keys never reached the game on Dandyhorse): the bridge
  // focuses this page when IT loads, the game's frame is focused while it is still loading, and the focus was found
  // left on this page's body. So: whenever this page has the focus and the game's frame does not, it is handed on.
  const focus = () => { try { if (document.activeElement !== frame) frame.focus({ preventScroll: true }) } catch { /* not loaded yet */ } }
  frame.addEventListener('load', focus)
  addEventListener('focus', () => setTimeout(focus, 0))
  addEventListener('pointerdown', focus)
  setInterval(() => { if (document.hasFocus() && document.activeElement !== frame) focus() }, 400)
})()
</script>
</body>
</html>
