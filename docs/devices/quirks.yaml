    params: { init_char: "0xFFF3", init: [0x55, 0xAA, 0x00, 0x00, 0x02, 0x16, 0x00, 0x00, 0x00, 0x00, 0x0D, 0x0A], notify: "0xFFF4", frame_length: 13, cadence_byte: 11, level_byte: 12 }
    notes: GR7 units without FTMS. Treat as read-only; QZ writes the simulation frame to 0xFFF3 with no evidence that it works.
    sources: [horizongr7bike/horizongr7bike.cpp, bluetooth.cpp:2092]

