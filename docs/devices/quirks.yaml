    flags: { has_proprietary_protocol: true, sim_unsupported: true, erg_unsupported: true }
    params: { service: "0xFFF0", write: "0xFFF1", notify: "0xFFF4", init: [0xF5, 0x20, 0x20, 0x40, 0xF6], frame_length: 12 }
    notes: Without 0xFFF0, treat the bike as FTMS (QZ instead saves it as an FTMS treadmill). Other YS_* models are FTMS. Some G1 units need the QZCompanionYesoul tablet app (#4688).
    sources: [yesoulbike/yesoulbike.cpp, bluetooth.cpp:2555, "#4688"]

