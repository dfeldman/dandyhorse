      incline_table: {0: [0x00,0x00], 1: [0x10,0x00], 2: [0x1a,0x00], 3: [0x24,0x00], 4: [0x2e,0x00], 5: [0x38,0x00], 6: [0x42,0x00], 7: [0x4c,0x00], 8: [0x56,0x00], 9: [0x60,0x00], 10: [0x6a,0x00]}
