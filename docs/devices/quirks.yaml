    params: { service: "0xFFF0", level_max: 23, esx500_level_max: 10, poll_frame_base: [0xF2, 0xC3, 0x07, 0x04, 0x00, 0x00, 0x00, 0x00, 0xFF, 0xFF, 0xBE] }
