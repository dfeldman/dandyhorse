  - id: bowflex_t9_ftms
    class: treadmill
    doc: treadmills/ftms-treadmill-quirks.md
    match: { name_prefix: [BFX_T9_] }
    protocol: ftms
    flags: { speed_sent_in_mph: true }
    notes: Exposes 0xFFF3 like Horizon but it must be ignored. With fitshow_treadmill_miles QZ also treats reported speed as mph. A 2026 Bowflex FTMS report showed the same mph/km/h confusion in both directions (#4210).
    sources: [horizontreadmill/horizontreadmill.cpp:1276-1278, horizontreadmill/horizontreadmill.cpp:1900-1903]

  - id: kettler_treadmill_ftms
    class: treadmill
    doc: treadmills/ftms-treadmill-quirks.md
    match: { name_prefix: [KETTLER TREADMILL] }
    protocol: ftms
    flags: { incline_encoded_lookup: true }
    params:
      incline_step: 1.0
      incline_max: 12
      # key = incline*10, value = [lo, hi] bytes of the 0x03 argument (write direction only)
      incline_table: {0: [0x00,0x00], 5: [0x05,0x00], 10: [0x14,0x00], 15: [0x15,0x00], 20: [0x1e,0x00], 25: [0x25,0x00], 30: [0x32,0x00], 35: [0x35,0x00], 40: [0x3c,0x00], 45: [0x45,0x00], 50: [0x50,0x00], 55: [0x55,0x00], 60: [0x5a,0x00], 65: [0x65,0x00], 70: [0x6e,0x00], 75: [0x75,0x00], 80: [0x78,0x00], 85: [0x85,0x00], 90: [0x8c,0x00], 95: [0x95,0x00], 100: [0x96,0x00], 105: [0x05,0x01], 110: [0x10,0x01], 115: [0x15,0x01], 120: [0x20,0x01]}
    notes: QZ never actually uses this entry by default. Its elliptical list matches the prefix "KETTLER " first (bluetooth.cpp:1259), so a KETTLER TREADMILL lands in the elliptical driver. A library should route it here.
    sources: [horizontreadmill/horizontreadmill.cpp:1362-1440, bluetooth.cpp:1259, bluetooth.cpp:1728]

  - id: iconcept_t01_ftms
    class: treadmill
    doc: treadmills/ftms-treadmill-quirks.md
    match: { name_prefix: [T01_] }
    protocol: ftms
    flags: { incline_encoded_lookup: true }
    params:
      incline_step: 1.0
      # read direction always; write direction only with iconcept_ftms_treadmill_inclination_table
      incline_table: {1: [0x3C,0x00], 2: [0x82,0x00], 3: [0xC8,0x00], 4: [0x04,0x01], 5: [0x4A,0x01], 6: [0x90,0x01], 7: [0xCC,0x01], 8: [0x12,0x02], 9: [0x58,0x02], 10: [0x94,0x02], 11: [0xDA,0x02], 12: [0x20,0x03], 13: [0x5C,0x03], 14: [0xA2,0x03], 15: [0xE8,0x03]}
    sources: [horizontreadmill/horizontreadmill.cpp:1446-1491, horizontreadmill/horizontreadmill.cpp:1946-1985]

