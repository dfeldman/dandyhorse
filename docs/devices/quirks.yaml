# Device quirk registry. Flag and param definitions: quirks.md.
# All flags default false; entries list only deviations from the class baseline.
# Matching (full algorithm in identification.md):
#   * Name keys are alternatives: the name must satisfy at least one of name_prefix, name_exact,
#     name_contains, name_regex (or or_gatt_has after connecting). Every other key present must hold.
#   * Pass 1 tries entries whose user_option the user has chosen for this device; pass 2 tries
#     entries without user_option. Within a pass, file order decides and the first match wins, so
#     specific prefixes come first and catch-all prefixes carry exclude_prefix (as QZ guards them).
#   * gatt_has can only be checked after connecting; if it fails, continue with the next match.
# Match keys:
#   name_prefix [list]      advertised local name starts with any of these
#   name_exact              whole name equals this
#   name_contains [list]    upper-cased name contains any of these
#   name_regex [list]       full-name regular expression, matched upper-cased
#   case_sensitive          applies to name_prefix; default false
#   name_length             exact name length
#   name_length_any [list]  name length is one of these
#   exclude_prefix [list]   none of these prefixes (always case-insensitive)
#   name_excludes_chars     none of these characters in the name
#   adv_service [list]      all listed UUIDs appear in the advertisement (pre-connect)
#   adv_service_absent      none appear in the advertisement
#   gatt_has [list]         all listed services/characteristics exist after connecting
#   or_gatt_has [list]      name alternative: matches if any is found after connecting
#   user_option             variant that cannot be detected; the app must ask the user.
#                           force_ftms = the user chose the generic FTMS driver for this device
#                           (QZ: its ftms_treadmill / ftms_bike device-name settings).
# Optional field recommend: support (default) | prefer_ftms (vendor protocol is legacy; use FTMS when present) |
#   skip (not worth supporting in a game). See README 'Support recommendations'.
# See identification.md for the two-phase matching algorithm.
# Sources: QZ = github.com/cagnulein/qdomyos-zwift (paths under src/devices/),
#          issue numbers refer to that repository.

devices:

  # ---------------------------------------------------------------- treadmills

  - id: horizon_7_series
    class: treadmill
    doc: treadmills/horizon.md
    match:
      name_regex: ['^(HORIZON[ _]?7\.[0-9]AT|HZ_7\.[0-9]AT)']
      gatt_has: ["0xFFF3"]   # writable characteristic, found after connecting
    protocol: horizon
    recommend: prefer_ftms
    flags:
      has_proprietary_protocol: true
      proprietary_init_overwrites_user_profiles: true
      nonsense_speed_on_connect: true
      name_changes_with_firmware: true
      speed_sent_in_tenth_kmh: true
    params: { speed_min_kmh: 0.8, speed_max_kmh: 19.3, speed_step_kmh: 0.1, incline_min: 0, incline_max: 15, incline_step: 0.5 }
    notes: >-
      7.0AT, 7.4AT and 7.8AT. speed_sent_in_tenth_kmh was measured on one 7.0AT, on firmware 3.001 and on
      the latest 2026 firmware, and is assumed for the whole 7 series. On firmware that uses standard units the belt runs ten times too
      slow rather than too fast. Reported speed is standard. Range 0.5 to 12 mph.
    sources: [devicelib/docs/hardware/horizon-7.0at.md, horizontreadmill/horizontreadmill.cpp:1288, "#3299", "#4270"]

  - id: horizon_proprietary
    class: treadmill
    doc: treadmills/horizon.md
    match:
      name_prefix: [HORIZON, HZ_T101-, HZ_7.0AT-, AFG SPORT, WLT2541, JFTMPARAGON, PARAGON X, JFTM, MATRIXTF50]
      gatt_has: ["0xFFF3"]   # writable characteristic, found after connecting
    protocol: horizon
    recommend: prefer_ftms
    flags:
      has_proprietary_protocol: true
      proprietary_init_overwrites_user_profiles: true
      nonsense_speed_on_connect: true
      name_changes_with_firmware: true
    params: { speed_max_kmh: 22, incline_min: 0, incline_max: 15, incline_step: 0.5, speed_step_kmh: 0.1 }
    notes: Prefer FTMS when 0x1826 is present. Variants 7.8 / Paragon X / Omega Z use different framing.
    sources: [horizontreadmill/horizontreadmill.cpp:90-905, "#4091", "#3391", "#4270", "#3809"]

  - id: horizon_7_8
    class: treadmill
    doc: treadmills/horizon.md
    match: { name_prefix: [HORIZON_7.8AT], gatt_has: ["0xFFF3"], user_option: horizon_7_8_or_paragon_x }
    protocol: horizon
    recommend: prefer_ftms
    flags: { has_proprietary_protocol: true, auto_start_on_speed: true, proprietary_init_overwrites_user_profiles: true, speed_sent_in_tenth_kmh: true }
    params: { speed_min_kmh: 0.8, speed_max_kmh: 19.3, speed_step_kmh: 0.1, incline_min: 0, incline_max: 15, incline_step: 0.5 }
    notes: The 7.8 start frames for the vendor protocol. Carries the 7-series FTMS speed quirk (see horizon_7_series).
    sources: [horizontreadmill/horizontreadmill.cpp:2901-2919, devicelib/docs/hardware/horizon-7.0at.md]

  - id: horizon_paragon_x
    class: treadmill
    doc: treadmills/horizon.md
    match: { name_prefix: [PARAGON X, JFTMPARAGON], gatt_has: ["0xFFF3"], user_option: horizon_7_8_or_paragon_x }
    protocol: horizon
    recommend: prefer_ftms
    flags: { has_proprietary_protocol: true, auto_start_on_speed: true, proprietary_init_overwrites_user_profiles: true }
    notes: QZ picks the 7.8 start frames and the Paragon X framing only from its horizon_treadmill_7_8, horizon_paragon_x and horizon_treadmill_omega_z settings. The names are hints for which option to offer.
    sources: [horizontreadmill/horizontreadmill.cpp:2901-2919]

  - id: sole_proprietary
    class: treadmill
    doc: treadmills/sole.md
    match: { name_prefix: [F63, F65, F80, F85, F89, S77, TT8, ST90, TRX7.5], adv_service_absent: ["0x1826"], gatt_has: [49535343-fe7d-4ae5-8fa9-9fafd205e455] }
    protocol: sole_dyaco_uart
    flags:
      has_proprietary_protocol: true
      ftms_capability_varies_by_firmware: true
      control_is_button_press: true
      control_only_while_belt_running: true
      speed_reported_in_mph: true
    params: { incline_min: 0, incline_max: 15, incline_step: 1.0, speed_max_kmh: 22, keepalive_ms: 300 }
    notes: Reached when FTMS is not advertised. Units that advertise FTMS match the FTMS entries; if FTMS control fails the probe in sole.md, fall back to this protocol. 2023 F85 FTMS firmware locks speed.
    sources: [solef80treadmill/solef80treadmill.cpp, bluetooth.cpp:1571-1584, "#429", "#2385", "#2607", "#2552"]

  - id: sole_f85_ftms
    class: treadmill
    doc: treadmills/sole.md
    match: { name_prefix: [F85], adv_service: ["0x1826"] }
    protocol: ftms
    flags: { ftms_capability_varies_by_firmware: true, incline_no_half_percent: true }
    params: { incline_min: -5, incline_step: 1.0 }
    notes: 2023 "ENT" firmware ignores FTMS speed (#2385). Sending below incline_min drove one unit to 15 % (#2552).
    sources: [horizontreadmill/horizontreadmill.cpp:2680-2685, "#2385", "#2552"]

  - id: sole_f89_ftms
    class: treadmill
    doc: treadmills/ftms-treadmill-quirks.md
    match: { name_prefix: [F89], adv_service: ["0x1826"] }
    protocol: ftms
    flags: { ftms_capability_varies_by_firmware: true }
    params: { incline_min: -5 }
    sources: [horizontreadmill/horizontreadmill.cpp:2686-2689]

  - id: sole_tt8_s77_ftms
    class: treadmill
    doc: treadmills/ftms-treadmill-quirks.md
    match: { name_prefix: [TT8, S77], adv_service: ["0x1826"] }
    protocol: ftms
    flags: { ftms_capability_varies_by_firmware: true }
    params: { incline_step: 1.0, incline_min_tt8: -6 }
    sources: [horizontreadmill/horizontreadmill.cpp:2690-2702, horizontreadmill/horizontreadmill.cpp:3513-3520]

  - id: domyos_proprietary
    class: treadmill
    doc: treadmills/domyos.md
    match:
      name_prefix: [Domyos]
      case_sensitive: true
      exclude_prefix: [DomyosBr, DOMYOS-BIKE, DOMYOS-BIKING-, DOMYOS-EL, DOMYOS-ROW]   # QZ routes Domyos-Bike and Domyos-EL earlier in its chain
      # QZ: adv_service_absent 0x1826, OR the vendor service is found after connecting
      gatt_has: [49535343-fe7d-4ae5-8fa9-9fafd205e455]
    protocol: domyos_f0
    flags:
      has_proprietary_protocol: true
      prefer_proprietary_if_vendor_service: true
      write_with_response_required: true
      speed_incline_single_command: true
    params:
      vendor_service: 49535343-fe7d-4ae5-8fa9-9fafd205e455
      speed_max_kmh: 22
      incline_min: 0
      incline_max: 20
      incline_step: 0.5
      keepalive_ms: 200
    sources: [domyostreadmill/domyostreadmill.cpp, bluetooth.cpp:1424-1431, horizontreadmill/horizontreadmill.cpp:2366-2371]

  - id: domyos_run100e
    class: treadmill
    doc: treadmills/domyos.md
    match: { name_prefix: [Domyos], case_sensitive: true, user_option: domyos_treadmill_run100e }
    protocol: domyos_f0
    flags: { has_proprietary_protocol: true, write_with_response_required: true, incline_report_unreliable: true }
    sources: [domyostreadmill/domyostreadmill.cpp:696-703]

  - id: domyos_tc_ftms
    class: treadmill
    doc: treadmills/domyos.md
    match: { name_prefix: [DOMYOS-TC], adv_service: ["0x1826"] }
    protocol: ftms
    flags:
      prefer_proprietary_if_vendor_service: true
      connects_to_advertised_peripherals: true
    params: { vendor_service: 49535343-fe7d-4ae5-8fa9-9fafd205e455 }
    notes: One unit stops the belt on some QZ incline values (#3843, unresolved).
    sources: [horizontreadmill/horizontreadmill.cpp:2597-2625, "#3843", "#4867"]

  - id: domyos_ts100_ftms
    class: treadmill
    doc: treadmills/ftms-treadmill-quirks.md
    match: { name_prefix: [DOMYOS], user_option: domyos_treadmill_ts100 }
    protocol: ftms
    flags: { incline_fixed_report: true }
    params: { incline_fixed: 15 }
    sources: [horizontreadmill/horizontreadmill.cpp:1985-1992]

  - id: fitshow_tunturi_t80
    class: treadmill
    doc: treadmills/fitshow.md
    match: { name_prefix: [TUNTURI T80-] }
    protocol: fitshow
    flags: { has_proprietary_protocol: true, speed_incline_single_command: true, retry_until_echoed: true, limits_reported_by_device: true }
    notes: Keep on FitShow even if FTMS is present. Pauses 2-3 times right after start (#4524, open).
    sources: [fitshowtreadmill/fitshowtreadmill.cpp:891-902, "#3567", "#4524"]

  - id: fitshow_noblepro
    class: treadmill
    doc: treadmills/fitshow.md
    match: { name_prefix: [NOBLEPRO CONNECT], adv_service_absent: ["0x1826"] }
    protocol: fitshow
    flags: { has_proprietary_protocol: true, speed_incline_single_command: true, retry_until_echoed: true, limits_reported_by_device: true, incline_half_percent_units: true }
    params: { incline_step: 0.5, service: "0000ae00-0000-1000-8000-00805f9b34fb" }
    sources: [fitshowtreadmill/fitshowtreadmill.cpp:149, fitshowtreadmill/fitshowtreadmill.cpp:539-540, "#4880"]

  - id: fitshow_sw14
    class: treadmill
    doc: treadmills/fitshow.md
    match: { name_prefix: [SW], case_sensitive: true, name_length: 14, name_excludes_chars: ["(", ")"], adv_service_absent: ["0x1826"] }
    protocol: fitshow
    flags: { has_proprietary_protocol: true, speed_incline_single_command: true, retry_until_echoed: true, limits_reported_by_device: true }
    notes: QZ also sends SW + 13 chars with '-' at index 10 (e.g. SW5731CAXI-0061) here; no registry key expresses "char at index" yet.
    sources: [bluetooth.cpp:2995-2997]

  - id: fitshow_treadmill
    class: treadmill
    doc: treadmills/fitshow.md
    match:
      name_prefix: [FS-, TR510-T, WINFITA, SW-BLE, BF70]
      # FS- and BF70 are case-sensitive in QZ
      exclude_prefix: [FS-YK-]
    protocol: fitshow
    flags:
      has_proprietary_protocol: true
      speed_incline_single_command: true
      retry_until_echoed: true
      limits_reported_by_device: true
    params: { incline_step: 1.0, keepalive_ms: 200 }
    notes: If 0x1826 is found after connecting and the name is not FS-/TR510-T, switch to FTMS (QZ does this via restart). The FS- prefix is also used by FitShow rowers (#4840) and several bikes.
    sources: [fitshowtreadmill/fitshowtreadmill.cpp, bluetooth.cpp:2992-3004, "#4549", "#1244", "#4840"]

  - id: kingsmith_r2_family
    class: treadmill
    doc: treadmills/kingsmith.md
    match: { name_prefix: [KS-ST-K12PRO, KS-R1AC, KS-HC-R1AA, KS-HC-R1AC, KS-X21, KS-HDSC-X21C, KS-HDSY-X21C, KS-NACH-X21C, KS-NGCH-X21C, KS-NACH-MXG, KS-NGCH-G1C] }
    protocol: kingsmith_text
    flags: { has_proprietary_protocol: true, cipher_variant_unknown: true, incline_control_unsupported: true }
    params: { speed_max_kmh: 22, speed_step_kmh: 0.1 }
    notes: KS-NACH-MXG (X23) always uses cipher table v7. Service/characteristic UUIDs vary by name, with fallbacks (see page).
    sources: [kingsmithr2treadmill/kingsmithr2treadmill.cpp, bluetooth.cpp:1448-1470, "#1473", "#2645"]

  - id: kingsmith_r1pro_family
    class: treadmill
    doc: treadmills/kingsmith.md
    match:
      name_prefix: [R1 PRO, KINGSMITH, DYNAMAX, WALKINGPAD, KS-ST-A1P, KS-SC-BLR2C, KS-H, KS-F0, KS-BLC, KS-BLR]
      exclude_prefix: [KS-HD-Z1D]
      gatt_has: ["0xFE00"]
    protocol: kingsmith_f7
    flags: { has_proprietary_protocol: true, incline_control_unsupported: true, lock_state_needs_unlock: true }
    params: { speed_max_kmh: 22, speed_step_kmh: 0.1, keepalive_ms: 200 }
    notes: Exact names RE and KS-S1 use a different first init frame. If 0xFE00 is absent but FTMS is present, use FTMS.
    sources: [kingsmithr1protreadmill/kingsmithr1protreadmill.cpp, bluetooth.cpp:1487-1505]

  - id: technogym_myrun_rfcomm
    class: treadmill
    doc: treadmills/technogym.md
    match: { name_prefix: ["MYRUN ", MERACH-U3], user_option: technogym_myrun_treadmill_experimental }
    protocol: technogym_spp_text
    flags: { has_proprietary_protocol: true }
    params: { transport: bluetooth_classic_spp, speed_max_kmh: 20, incline_max: 12 }
    notes: Not possible on iOS. Commands are "!DEV,024,<kmh>,1.8#" and "!DEV,025,<pct>#".
    sources: [technogymmyruntreadmillrfcomm/technogymmyruntreadmillrfcomm.cpp]

  - id: technogym_myrun
    class: treadmill
    doc: treadmills/technogym.md
    match: { name_prefix: ["MYRUN ", MERACH-U3] }
    protocol: technogym_myrun
    flags:
      request_control_with_code: true
      vendor_text_one_byte_per_write: true
      skip_control_refresh: true
      ftms_capability_varies_by_firmware: true
    params:
      request_control_bytes: [0x00, 0x93, 0xF0, 0x51, 0xE8, 0x1B, 0x42, 0x92, 0x8E]
      vendor_char: df1eb8e4-1753-4bb9-a6a6-e018040af0a3
      vendor_init: ["@DISABLE_PACE#", "@SSIUNITS#", "@RJSK_EN 1#", "@LJSK_EN 1#"]
      weight_char: "0x2A98"
      speed_max_kmh: 22
      incline_max: 15
    notes: Some firmware exposes no control point and is read-only (#1737).
    sources: [technogymmyruntreadmill/technogymmyruntreadmill.cpp, bluetooth.cpp:1771-1815, "#1737", "#620", "#1261"]

  - id: technogym_run_ftms
    class: treadmill
    doc: treadmills/technogym.md
    match: { name_exact: TREADMILL, adv_service: ["0x1826"] }
    protocol: ftms
    notes: QZ matches the prefix TREADMILL; with RSC (0x1814) instead it is a foot pod, with neither it is a True treadmill.
    sources: [bluetooth.cpp:1654, horizontreadmill/horizontreadmill.cpp:2706-2708]

  - id: bowflex_t_proprietary
    class: treadmill
    doc: treadmills/bowflex-nautilus.md
    match: { name_prefix: [BOWFLEX T] }
    protocol: nautilus_inc
    flags: { has_proprietary_protocol: true, speed_control_unsupported: true, incline_control_unsupported: true, speed_reported_in_mph: true }
    params:
      write_char: 1717b3c0-9803-11e3-90e1-0002a5d5c51b
      data_char: a46a4a80-9803-11e3-8f3c-0002a5d5c51b
      service_variants: {default: edff9e80-cad7-11e5-ab63-0002a5d5c51b, default_alt: b1216c2e-464e-4c46-b2b4-0b5c8eb23dae, t6: 15b7bf49-1693-481e-b877-69d33ce6bafa, btx116: b5c78780-cad7-11e5-b9f8-0002a5d5c51b, t8j: ebbe6870-d00a-4bf4-bb79-63b35bf4c6b5}
    notes: Read-only; start and stop only. Pause keeps reporting the last speed (#712).
    sources: [bowflext216treadmill/bowflext216treadmill.cpp, bluetooth.cpp:2662, "#2202", "#712"]

  - id: nautilus_t_proprietary
    class: treadmill
    doc: treadmills/bowflex-nautilus.md
    match: { name_prefix: [NAUTILUS T] }
    protocol: nautilus_inc
    flags: { has_proprietary_protocol: true, speed_control_unsupported: true, incline_control_unsupported: true, speed_reported_in_mph: true }
    params: { write_char: 1717b3c0-9803-11e3-90e1-0002a5d5c51b, init_frame: [0x07, 0x01, 0xD3, 0x00, 0x1F, 0x05, 0x01] }
    notes: The T628 does not report incline.
    sources: [nautilustreadmill/nautilustreadmill.cpp, bluetooth.cpp:2692]

  - id: ifit_ble_treadmill
    class: treadmill
    doc: treadmills/ifit.md
    match: { name_prefix: [I_TL, I_IT], case_sensitive: true, name_contains: ["_IFIT TREADMILL"] }
    protocol: ifit_ble
    flags: { has_proprietary_protocol: true, model_selection_required: true, control_only_while_belt_running: true }
    params:
      service: 00001533-1412-efde-1523-785feabcd123
      write_char: 00001534-1412-efde-1523-785feabcd123
      notify_char: 00001535-1412-efde-1523-785feabcd123
      speed_max_kmh: 22
      incline_min: -3
      incline_max: 15
      models: [nordictrack_10_treadmill, nordictrack_t70_treadmill, nordictrack_t65s_treadmill, nordictrack_t65s_83_treadmill, nordictrack_t65s_treadmill_81_miles, nordictrack_s20_treadmill, nordictrack_s20i_treadmill, norditrack_s25_treadmill, norditrack_s25i_treadmill, nordictrack_s30_treadmill, nordictrack_elite_800, nordictrack_incline_trainer_x7i, nordictrack_incline_trainer_x7i_ntl15010_0, nordictrack_treadmill_exp_5i, nordictrack_tseries5_treadmill, nordictrack_series_7, nordictrack_treadmill_ultra_le, nordictrack_treadmill_commercial_le, proform_treadmill_1800i, proform_treadmill_se, proform_treadmill_8_0, proform_treadmill_9_0, proform_treadmill_cadence_lt, proform_treadmill_z1300i, proform_pro_1000_treadmill, proform_treadmill_l6_0s, proform_8_5_treadmill, proform_2000_treadmill, proform_treadmill_sport_8_5, proform_treadmill_sport_70, proform_treadmill_sport_3_0, proform_treadmill_505_cst, proform_505_cst_80_44, proform_treadmill_cst_505_pftl59420_0, proform_treadmill_705_cst, proform_treadmill_705_cst_V78_239, proform_treadmill_705_cst_V80_44, proform_treadmill_105_cst, proform_carbon_tl, proform_carbon_tl_PFTL59720, proform_carbon_tl_PFTL59722c, proform_carbon_tl_PFTL59723_6, proform_carbon_tlx_treadmill, proform_carbon_tlx_v84_314_treadmill, proform_treadmill_carbon_tls, proform_proshox2, proform_595i_proshox2, proform_treadmill_8_7, proform_treadmill_575i, proform_performance_300i, proform_performance_400i, proform_treadmill_c700, proform_treadmill_c960i, proform_treadmill_1500_pro, proform_trainer_8_0, proform_trainer_8_0_pftl59721_int_0, proform_treadmill_995i]
    notes: Init and poll are per-model replays of iFit app traffic. Speed/incline set-points use one frame with a sum checksum; see the page for the per-model exceptions.
    sources: [proformtreadmill/proformtreadmill.cpp, bluetooth.cpp:2583, "#4412", "#1119"]

  - id: ifit_adb_treadmill
    class: treadmill
    doc: treadmills/ifit.md
    match: { user_option: nordictrack_2950_ip }
    protocol: ifit_adb
    recommend: skip
    flags: { model_selection_required: true, control_via_touch_injection: true }
    params:
      transport: adb_or_companion_udp
      companion_udp_in: 8002
      companion_udp_out: 8003
      incline_step: 0.5
      incline_min_interval_ms: 1000
      models: [default_2950, nordictrack_x22i, nordictrack_treadmill_t8_5s, nordictrack_treadmill_x14i, proform_treadmill_carbon_t7, nordictrack_treadmill_1750_adb, proform_trainer_9_0]
    notes: Slider coordinates change with the iFit UI version (#5024). Needs iFit privileged mode (#4565).
    sources: [nordictrackifitadbtreadmill/nordictrackifitadbtreadmill.cpp, "#5024", "#4565", "#3118", "#2171"]

  - id: ifit_wifi_treadmill
    class: treadmill
    doc: treadmills/ifit.md
    match: { user_option: proformtreadmillip }
    protocol: ifit_wifi_ws
    flags: { telemetry_keys_localized: true, limits_reported_by_device: true }
    params: { url: "ws://<ip>/control" }
    sources: [proformwifitreadmill/proformwifitreadmill.cpp]

  - id: lifefitness_lf
    class: treadmill
    doc: treadmills/lifefitness.md
    match: { name_prefix: [LF], name_length_any: [15, 18] }
    protocol: lifefitness
    flags: { has_proprietary_protocol: true, speed_control_unsupported: true, incline_control_unsupported: true }
    params:
      track_connect_char: ce78e85e-9cb6-11e5-8994-feff819cdc9f
      track_connect_token: "8a24c84aa4c0400c96ed1faa20fa4594"
      t5_command_char: c52d3161-d1a1-11e3-9c1a-0800200c9a66
      t5_data_char: 4a8ff3f1-c933-11e3-9c1a-0800200c9a66
    notes: Telemetry via FTMS 0x2ACD/0x2ACE after the Track Connect handshake, or the 40-byte T5 frame.
    sources: [lifefitnesstreadmill/lifefitnesstreadmill.cpp, bluetooth.cpp:1624, "#3381", "#834"]

  - id: gem_module_treadmill
    class: treadmill
    doc: treadmills/lifefitness.md
    match: { name_prefix: [TREADMILL], user_option: gem_module_inclination }
    protocol: ftms
    notes: NPE GEM retrofit on commercial treadmills (Life Fitness, Precor). With 0x1826 advertised, the technogym_run_ftms entry already matches.
    sources: [bluetooth.cpp:1654, "#2476", "#579"]

  - id: spirit_ftms
    class: treadmill
    doc: treadmills/spirit.md
    match: { name_prefix: [XT485, XT685, XT285], adv_service: ["0x1826"] }
    protocol: ftms
    flags: { speed_control_unsupported: true, ftms_capability_varies_by_firmware: true }
    notes: Spirit blocks speed control from apps for safety (#2323). QZ matches XT685/XT285 without requiring the advertised service.
    sources: [bluetooth.cpp:1649-1750, "#2323", "#4474", "#4505"]

  - id: spirit_dyaco_uart
    class: treadmill
    doc: treadmills/spirit.md
    match: { name_prefix: [XT385, XT485, XT800, XT900] }
    protocol: spirit_dyaco_uart
    flags: { has_proprietary_protocol: true, speed_control_unsupported: true, control_is_button_press: true }
    params: { incline_min: 0, incline_max: 15, incline_step: 0.5, keepalive_ms: 200 }
    notes: Same board family as Sole. Incline presses only on XT385. An XT385 worked better as an FTMS treadmill (#4474).
    sources: [spirittreadmill/spirittreadmill.cpp, bluetooth.cpp:2789, "#283", "#550"]

  - id: echelon_stride4
    class: treadmill
    doc: treadmills/echelon-stride.md
    match: { name_prefix: [STRIDE4] }
    protocol: echelon
    flags: { has_proprietary_protocol: true, speed_control_unsupported: true, incline_control_unsupported: true, echo_device_frames: true }
    params: { service: 0bf669f1-45f2-11e7-9598-0800200c9a66, echo_commands: [0xD0, 0xD2, 0xD3], poll_ms: 2000, handshake_frame: [0xF0, 0xE0, 0xFD, 0x3E, 0x65, 0x48, 0xD5, 0x8D] }
    notes: Speed comes in the D1 frame (bytes 7..8, /100).
    sources: [echelonstride/echelonstride.cpp]

  - id: echelon_stride
    class: treadmill
    doc: treadmills/echelon-stride.md
    match: { name_prefix: [ECH-STRIDE, ECH-UK-, ECH-FR-, STRIDE, STRIDE6S-, ECH-SD-SPT] }
    protocol: echelon
    flags:
      has_proprietary_protocol: true
      speed_control_unsupported: true
      incline_control_unsupported: true
      echo_device_frames: true
      vendor_app_auth_required: true
    params: { service: 0bf669f1-45f2-11e7-9598-0800200c9a66, echo_commands: [0xD0, 0xD2, 0xD3], poll_ms: 2000, locked_frame_prefix: [0xF0, 0xE0], locked_frame_length: 8 }
    notes: Speed unit (mph or km/h x1000) varies per unit (#1528). Newer firmware can be vendor-locked (#4831); treat vendor_app_auth_required as possible.
    sources: [echelonstride/echelonstride.cpp, bluetooth.cpp:2262, "#2534", "#1721", "#4831"]

  - id: octane_zero_runner
    class: treadmill
    doc: treadmills/octane-zero-runner.md
    match: { name_prefix: [ZR7, ZR8] }
    protocol: octane
    flags: { has_proprietary_protocol: true, user_driven_speed: true, speed_control_unsupported: true, incline_control_unsupported: true }
    params:
      service: 96dc867d-7a83-4c22-b6be-6381d727aeda
      write_char: 96dc867f-7a83-4c22-b6be-6381d727aeda
      notify_char: 96dc867e-7a83-4c22-b6be-6381d727aeda
      message_ids: { MODEL_AND_VERSION: 5, ZR_PACE: 35, ZR_CADENCE: 58, MACHINE_PREFS: 112 }
    notes: Non-motorized. Values are located by searching for message IDs; speed = 3600 / pace.
    sources: [octanetreadmill/octanetreadmill.cpp, bluetooth.cpp:2296, "#864", "#1338", "#2030"]

  - id: toorx_ftms_treadmill
    class: treadmill
    doc: treadmills/toorx.md
    match: { name_prefix: [TOORX, I-CONSOLE+], user_option: toorx_ftms_treadmill }
    protocol: ftms
    params: { incline_step: 1.0 }
    notes: Unlocked speed control on a Reebok FR30z that refused it on the App Gate path (#3247).
    sources: [bluetooth.cpp:1674, horizontreadmill/horizontreadmill.cpp:3513-3520, "#3247"]

  - id: toorx_rfcomm_treadmill
    class: treadmill
    doc: treadmills/toorx.md
    match: { name_prefix: [TRX ROUTE KEY, MASTERT40-, BH DUALKIT TREAD, TF-T, BH-TR-] }
    protocol: toorx_spp
    flags: { has_proprietary_protocol: true, bluetooth_classic_only: true }
    params: { poll_ms: 1000, speed_max_kmh: 22, incline_max: 15 }
    notes: TRX ROUTE KEY is case-sensitive. Start is a one-frame-per-second script that differs for MASTERT40 and toorx_65s_evo.
    sources: [toorxtreadmill/toorxtreadmill.cpp, bluetooth.cpp:2749, "#541"]

  - id: toorx_appgate_treadmill
    class: treadmill
    doc: treadmills/toorx.md
    match: { name_prefix: [TOORX, V-RUN, K80_, I-CONSOLE+, ICONSOLE+, I-RUNNING, DKN RUN, ADIDAS , REEBOK] }
    protocol: toorx_appgate
    flags:
      has_proprietary_protocol: true
      speed_control_unsupported: true
      wire_values_plus_one: true
      model_selection_required: true
    params:
      device_ids: { toorx: 0x01, toorx_appgate_3_0: 0x23, reebok: 0x32, adidas: 0x5B, dkn_run: 0x04 }
      poll_ms: 200
      incline_step: 1.0
    notes: TOORX and V-RUN are case-sensitive. The same names are used by the family's bikes, ellipticals and rowers; QZ picks the class from user settings.
    sources: [trxappgateusbtreadmill/trxappgateusbtreadmill.cpp, bluetooth.cpp:2816, "#2223", "#1107", "#1762"]

  - id: true_treadmill
    class: treadmill
    doc: treadmills/other.md
    match: { name_prefix: [TRUE, ASSAULT TREADMILL, WDWAY], exclude_prefix: [TRUE 1000] }
    protocol: true_wahoo_style
    flags: { has_proprietary_protocol: true, speed_control_unsupported: true, incline_control_unsupported: true }
    params: { service: a026ee07-0a7d-4ab3-97fa-f1500f9feb8b, notify_char: a026e01d-0a7d-4ab3-97fa-f1500f9feb8b }
    notes: WDWAY needs name length 8. TRUE TREADMILL nnn and TRUE 1000 are FTMS. Plain TREADMILL without RSC or FTMS also lands here in QZ.
    sources: [truetreadmill/truetreadmill.cpp, bluetooth.cpp:1542-1556]

  - id: lifespan_treadmill
    class: treadmill
    doc: treadmills/other.md
    match: { name_prefix: [LIFESPAN] }
    protocol: lifespan
    flags: { has_proprietary_protocol: true, incline_control_unsupported: true }
    params: { service: "0xFFF0", write_char: "0xFFF2", notify_char: "0xFFF1" }
    notes: Replies carry no command id; parse by the last query sent. The same name is used by Lifespan bikes (user_option lifespan_bike).
    sources: [lifespantreadmill/lifespantreadmill.cpp, bluetooth.cpp:2339, "#1689"]

  - id: sperax_walking_pad
    class: treadmill
    doc: treadmills/other.md
    match: { name_prefix: [SPERAX_RM01, SPERAX_RM-02] }
    protocol: sperax_replay
    flags: { has_proprietary_protocol: true, incline_control_unsupported: true }
    params: { speed_min_kmh: 0.1, speed_max_kmh: 6.0 }
    notes: Speed frames are a replayed table for 0.1..6.0 km/h. SPERAX_RM-01 (with a hyphen) is FTMS.
    sources: [speraxtreadmill/speraxtreadmill.cpp, bluetooth.cpp:1604]

  - id: pitpat_deerrun
    class: treadmill
    doc: treadmills/other.md
    match: { name_prefix: [PITPAT-T] }
    protocol: deerrun
    flags: { has_proprietary_protocol: true, speed_incline_single_command: true, ftms_capability_varies_by_firmware: true }
    notes: Three frame templates (PitPat, Superun BA04, default). Newer PitPat firmware did not respond (#4058).
    sources: [deeruntreadmill/deerruntreadmill.cpp, bluetooth.cpp:2616, "#3589", "#4058"]

  - id: focus_fitness_treadmill
    class: treadmill
