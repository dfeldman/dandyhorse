  # ----------------------------------------------------------------- run sensors

  - id: stryd5_footpod
    class: run_sensor
    doc: treadmills/run-sensors.md
    match: { name_prefix: [Stryd5] }
    protocol: rsc_cps
    params:
      indoor_mode_char: 7e78aa20-72cd-d3b8-a81f-5b7e589bea0f
      indoor_mode_write: [0x15, 0x00]
      indoor_mode_ack_char: 7e78aa19-72cd-d3b8-a81f-5b7e589bea0f
    notes: Write 15 00 and wait for 15 00 00 (indoor); retry up to 3 times.
    sources: [strydrunpowersensor/strydrunpowersensor.cpp:110-131, strydrunpowersensor/strydrunpowersensor.cpp:520-535]

  - id: zwift_runpod
    class: run_sensor
    doc: treadmills/run-sensors.md
    match: { name_prefix: [ZWIFT RUNPOD] }
    protocol: rsc_cps
    notes: Cadence convention differs from Strava's (#1099).
    sources: [bluetooth.cpp:1149, "#1099"]

  - id: nohrd_sprintbok
    class: run_sensor
    doc: treadmills/run-sensors.md
    match: { name_prefix: [NOHRD SPRINTBOK] }
