  - id: shuaa5_treadmill
    class: treadmill
    doc: treadmills/other.md
    match: { name_prefix: [ZW-] }
    protocol: ftms
    flags: { skip_control_refresh: true }
    notes: Minimal FTMS client; incline sent as a single byte.
