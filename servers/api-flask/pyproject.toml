[project]
name = "dandyhorse-api-flask"
version = "0.1.0"
description = "Dandyhorse reference API server (Flask)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "flask-oidc>=2.4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dandyhorse"]
